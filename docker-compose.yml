services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_LOGIN: orangescrum
      DB_PASSWORD: orangescrum
      DB_DATABASE: orangescrum
      # Points at MailHog by default so mail can be verified without real
      # SMTP credentials. Override these to point at Gmail/SendGrid/etc.
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_UNAME: ""
      SMTP_PWORD: ""
      SMTP_SECURE: "none"
      WEB_DOMAIN: "localhost:8080"
      SUB_FOLDER: ""
      FROM_EMAIL: "noreply@localhost"
      SUPPORT_EMAIL: "support@localhost"
    volumes:
      # Bind-mount the whole source tree so code/view/CSS edits apply live
      # (no image rebuild needed). app/tmp is a named volume so container-owned
      # cache/logs don't fight host permissions.
      - .:/var/www/html
      - app_tmp:/var/www/html/app/tmp
    depends_on:
      - mysql
      - mailhog

  mysql:
    image: mysql:8.0
    # mysql:5.7 has no arm64 image; PHP 7.4's older mysqlnd needs the legacy
    # auth plugin to talk to MySQL 8's default caching_sha2_password.
    # sql-mode is emptied because this app (like Orangescrum) requires STRICT
    # mode OFF — it inserts zero-dates and relies on implicit column defaults
    # that STRICT_TRANS_TABLES/NO_ZERO_DATE/ONLY_FULL_GROUP_BY would reject,
    # which otherwise makes signup and many saves fail.
    command: >-
      --default-authentication-plugin=mysql_native_password
      --sql-mode=
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orangescrum
      MYSQL_USER: orangescrum
      MYSQL_PASSWORD: orangescrum
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    ports:
      - "3306:3306"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025" # web UI - view caught mail at http://localhost:8025
      - "1025:1025" # SMTP

volumes:
  db_data:
  app_tmp:
